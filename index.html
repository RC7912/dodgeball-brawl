<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dodgeball Brawl</title>
<style>
  html,body{margin:0;height:100%;background:#0e0f14;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;user-select:none}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;cursor:crosshair;border-radius:8px;box-shadow:0 10px 40px #000a}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;backdrop-filter:blur(3px)}
  .hidden{display:none}
  .panel{background:#1b1e29;border:2px solid #333a52;border-radius:16px;padding:28px 36px;text-align:center;max-width:520px;width:calc(100% - 32px);box-sizing:border-box}
  h1{margin:0 0 4px;font-size:44px;letter-spacing:2px;color:#ff5a3c;text-shadow:3px 3px 0 #000}
  h2{margin:0 0 12px;font-size:36px}
  .sub{color:#aab;margin:0 0 20px}
  .row{margin:14px 0}
  .row label{display:block;color:#aab;font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  button{font:inherit;font-weight:700;background:#2a2f42;color:#fff;border:2px solid #3d4460;border-radius:10px;padding:8px 14px;margin:3px;cursor:pointer}
  button:hover{background:#353b54}
  button.sel{background:#ff5a3c;border-color:#ff8a70}
  button.big{font-size:22px;padding:12px 36px;background:#ff5a3c;border-color:#ff8a70;margin-top:10px}
  button.big:hover{background:#ff7055}
  .controls{font-size:14px;color:#ccd;line-height:1.7;margin-top:16px;text-align:left;display:inline-block}
  kbd{background:#333a52;border-radius:4px;padding:1px 6px;font-family:inherit;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>DODGEBALL BRAWL</h1>
    <p class="sub" id="modeDesc"></p>
    <div class="row"><label>Mode</label><div id="modeBtns"></div></div>
    <div class="row" id="cpuRow"><label>CPU opponents</label><div id="cpuBtns"></div></div>
    <div class="row hidden" id="teamRow"><label>Team size</label><div id="teamBtns"></div></div>
    <div class="row"><label>Difficulty</label><div id="diffBtns"></div></div>
    <button class="big" id="startBtn">PLAY</button>
    <div class="controls">
      <kbd>WASD</kbd> / <kbd>Arrows</kbd> move &nbsp; <kbd>Mouse</kbd> aim<br>
      <kbd>Left click</kbd> throw (walk over a ball to pick it up)<br>
      <kbd>Space</kbd> / <kbd>Right click</kbd> catch: time it right and the thrower is out<br>
      <kbd>Shift</kbd> dash &nbsp; <kbd>P</kbd> / <kbd>Esc</kbd> / ⏸ button pause &nbsp; <kbd>R</kbd> restart
    </div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <button class="big" id="resumeBtn">RESUME</button><br>
    <button id="restartBtn">Restart</button>
    <button id="quitBtn">Quit to menu</button>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="panel">
    <h2 id="endTitle">YOU WIN!</h2>
    <p class="sub" id="endSub"></p>
    <button class="big" id="againBtn">PLAY AGAIN</button><br>
    <button id="menuBtn">Menu</button>
  </div>
</div>

<script>
(() => {
const W = 960, H = 640;
const A = { x: 40, y: 70, w: 880, h: 540 }; // arena
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', resize); resize();

// ---------- settings ----------
const DIFF = {
  easy:   { speed: 175, throwSpd: 560, err: 0.20, dodge: 0.30, catch: 0.05, react: 0.35, cool: [1.3, 2.4], dash: false },
  normal: { speed: 215, throwSpd: 680, err: 0.11, dodge: 0.55, catch: 0.12, react: 0.2,  cool: [0.8, 1.6], dash: false },
  hard:   { speed: 245, throwSpd: 800, err: 0.05, dodge: 0.80, catch: 0.22, react: 0.08, cool: [0.45, 1.0], dash: true },
};
const settings = { mode: 'ffa', cpus: 3, teamSize: 3, diff: 'normal' };
const TEAM_NAMES = ['BLUE', 'RED'];
const TEAM_COLORS = ['#4cc9f0', '#ff5a5a'];
const TEAM_SHADES = [['#4cc9f0', '#4895ef', '#72efdd', '#90e0ef', '#56cfe1'], ['#ff5a5a', '#ff9f1c', '#f72585', '#ef476f', '#ffb4a2']];
const CPU_INFO = [
  ['Blaze', '#ff9f1c'], ['Frost', '#4cc9f0'], ['Viper', '#80ed99'],
  ['Rocket', '#f72585'], ['Ghost', '#c8b6ff'], ['Tank', '#ffd166'], ['Nova', '#ef476f'],
  ['Bolt', '#ffffff'],
];
const PLAYER_SPEED = 265, PLAYER_THROW = 800;
const SIT_GRACE = 1.2, SIT_REACH = 34; // seconds before a sitter can grab; extra grab reach for sitters

// ---------- menu ----------
function makeBtns(el, vals, key, fmt, onChange) {
  el.innerHTML = '';
  for (const v of vals) {
    const b = document.createElement('button');
    b.textContent = fmt ? fmt(v) : v;
    if (settings[key] === v) b.className = 'sel';
    b.onclick = () => { settings[key] = v; makeBtns(el, vals, key, fmt, onChange); if (onChange) onChange(); };
    el.appendChild(b);
  }
}
function syncMenu() {
  const teams = settings.mode === 'teams';
  document.getElementById('cpuRow').classList.toggle('hidden', teams);
  document.getElementById('teamRow').classList.toggle('hidden', !teams);
  document.getElementById('modeDesc').textContent = teams
    ? 'Blue vs Red, one ball. Stay on your side of the center line. Get hit and you sit on the sideline until the ball rolls near you. Catch a throw to knock out the thrower and bring a teammate back in. Knock out the whole other team to win.'
    : 'One ball, no teams, everyone for themselves. Get hit and you sit on the sideline until the ball rolls near you. Last one standing wins.';
}
makeBtns(document.getElementById('modeBtns'), ['ffa', 'teams'], 'mode', v => v === 'ffa' ? 'Free-for-all' : 'Teams', syncMenu);
makeBtns(document.getElementById('teamBtns'), [1, 2, 3, 4], 'teamSize', v => `${v} v ${v}`);
makeBtns(document.getElementById('cpuBtns'), [1, 2, 3, 4, 5, 6, 7], 'cpus');
syncMenu();
makeBtns(document.getElementById('diffBtns'), ['easy', 'normal', 'hard'], 'diff', v => v[0].toUpperCase() + v.slice(1));
const menuEl = document.getElementById('menu'), endEl = document.getElementById('end');
document.getElementById('startBtn').onclick = () => { initAudio(); menuEl.classList.add('hidden'); newGame(); };
document.getElementById('againBtn').onclick = () => { endEl.classList.add('hidden'); newGame(); };
document.getElementById('menuBtn').onclick = () => { endEl.classList.add('hidden'); menuEl.classList.remove('hidden'); state = 'menu'; };

// ---------- pause ----------
const pauseEl = document.getElementById('pause');
const PAUSE_BTN = { x: W - 46, y: 10, w: 36, h: 36 };
function setPaused(on) {
  if (on && state !== 'play') return;
  if (!on && state !== 'paused') return;
  state = on ? 'paused' : 'play';
  pauseEl.classList.toggle('hidden', !on);
  for (const k in keys) keys[k] = false; // don't keep running on keys released while paused
}
const togglePause = () => setPaused(state === 'play');
const overPauseBtn = () => mouse.x >= PAUSE_BTN.x && mouse.x <= PAUSE_BTN.x + PAUSE_BTN.w && mouse.y >= PAUSE_BTN.y && mouse.y <= PAUSE_BTN.y + PAUSE_BTN.h;
document.getElementById('resumeBtn').onclick = () => setPaused(false);
document.getElementById('restartBtn').onclick = () => { pauseEl.classList.add('hidden'); newGame(); };
document.getElementById('quitBtn').onclick = () => { pauseEl.classList.add('hidden'); menuEl.classList.remove('hidden'); state = 'menu'; };
addEventListener('blur', () => setPaused(true)); // auto-pause when you switch away

// ---------- audio ----------
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  throw: () => beep(500, 0.12, 'triangle', 0.08, 300),
  hit:   () => { beep(140, 0.25, 'sawtooth', 0.12, -90); beep(90, 0.3, 'square', 0.06, -50); },
  catch: () => { beep(660, 0.1, 'square', 0.07); setTimeout(() => beep(990, 0.15, 'square', 0.07), 80); },
  pick:  () => beep(880, 0.05, 'sine', 0.05),
  bounce:() => beep(220, 0.04, 'sine', 0.04),
  out:   () => beep(300, 0.6, 'sawtooth', 0.09, -250),
  dash:  () => beep(200, 0.1, 'sine', 0.05, 400),
};

// ---------- input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, click: false, rclick: false };
let catchPressed = false, dashPressed = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) {
    if (k === ' ') catchPressed = true;
    if (k === 'shift') dashPressed = true;
    if (k === 'p' || k === 'escape') togglePause();
    if (k === 'r' && state !== 'menu') { endEl.classList.add('hidden'); pauseEl.classList.add('hidden'); newGame(); }
  }
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
  cv.style.cursor = state === 'play' && overPauseBtn() ? 'pointer' : 'crosshair';
});
cv.addEventListener('mousedown', e => {
  initAudio();
  if (e.button === 0 && state === 'play' && overPauseBtn()) { setPaused(true); return; }
  if (e.button === 0) mouse.click = true; if (e.button === 2) catchPressed = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const MID = A.x + A.w / 2;
const isEnemy = (a, b) => a !== b && a.team !== b.team;
// horizontal range a player may stand in (teams: own half of the court)
function xRange(p) {
  if (mode !== 'teams') return [A.x + p.r, A.x + A.w - p.r];
  return p.team === 0 ? [A.x + p.r, MID - p.r] : [MID + p.r, A.x + A.w - p.r];
}

// ---------- game state ----------
let state = 'menu', players = [], balls = [], particles = [], popups = [];
let countdown = 0, shake = 0, time = 0, ballId = 0, mode = 'ffa';

function makePlayer(name, color, x, y, isHuman, team) {
  return {
    name, color, team, outAt: 0, x, y, vx: 0, vy: 0, r: 18, isHuman, alive: true, outT: 0, sitX: 0, sitY: 0, hits: 0, revives: 0,
    ball: null, aim: 0, catchT: 0, catchCd: 0, dashT: 0, dashCd: 0, invuln: 0, pickCd: 0, throwCd: 0, flash: 0,
    ai: isHuman ? null : { target: null, throwT: rand(1, 2), strafe: Math.random() < 0.5 ? 1 : -1, strafeT: rand(1, 3), reacts: new Map(), wander: null },
  };
}

function newGame() {
  players = []; balls = []; particles = []; popups = [];
  mode = settings.mode;
  const cx = A.x + A.w / 2, cy = A.y + A.h / 2;
  if (mode === 'teams') {
    const n = settings.teamSize;
    let nameIdx = 0;
    for (let t = 0; t < 2; t++) for (let i = 0; i < n; i++) {
      const x = t === 0 ? A.x + A.w * 0.18 : A.x + A.w * 0.82;
      const y = A.y + A.h * (i + 1) / (n + 1);
      const human = t === 0 && i === 0;
      players.push(human ? makePlayer('YOU', '#ffffff', x, y, true, 0)
                         : makePlayer(CPU_INFO[nameIdx++][0], TEAM_SHADES[t][i % 5], x, y, false, t));
    }
  } else {
    const n = settings.cpus + 1;
    for (let i = 0; i < n; i++) {
      const ang = Math.PI + (i / n) * Math.PI * 2;
      const x = cx + Math.cos(ang) * A.w * 0.4, y = cy + Math.sin(ang) * A.h * 0.38;
      players.push(i === 0 ? makePlayer('YOU', '#ffffff', x, y, true, 0) : makePlayer(CPU_INFO[i - 1][0], CPU_INFO[i - 1][1], x, y, false, i));
    }
  }
  for (const p of players) p.aim = Math.atan2(cy - p.y, cx - p.x);
  balls.push({ id: ballId++, x: cx, y: cy, vx: 0, vy: 0, r: 10, state: 'ground', owner: null, holder: null, spin: 0 });
  countdown = 3; state = 'play'; mouse.click = false; catchPressed = false; dashPressed = false;
}

// ---------- actions ----------
function throwBall(p, ang, spd) {
  const b = p.ball; if (!b) return;
  b.state = 'live'; b.owner = p; b.holder = null; b.throwStamp = time + Math.random();
  b.x = p.x + Math.cos(ang) * (p.r + b.r + 2); b.y = p.y + Math.sin(ang) * (p.r + b.r + 2);
  b.vx = Math.cos(ang) * spd; b.vy = Math.sin(ang) * spd;
  p.vx -= Math.cos(ang) * 60; p.vy -= Math.sin(ang) * 60;
  p.ball = null; p.pickCd = 0.3; p.throwCd = 0.25;
  sfx.throw();
}
function startCatch(p) {
  if (p.catchCd > 0 || p.ball || !p.alive) return;
  p.catchT = 0.28; p.catchCd = 0.85;
}
function startDash(p, dx, dy) {
  if (p.dashCd > 0) return;
  const l = Math.hypot(dx, dy); if (!l) return;
  p.vx = dx / l * 700; p.vy = dy / l * 700; p.dashT = 0.14; p.dashCd = 1.1;
  if (p.isHuman) sfx.dash();
}
function dropBall(p) {
  const b = p.ball; if (!b) return;
  b.state = 'ground'; b.holder = null; b.owner = null;
  b.vx = rand(-80, 80); b.vy = rand(-80, 80);
  p.ball = null;
}
function knockOut(p, reason) {
  if (!p.alive) return;
  p.alive = false; p.outT = SIT_GRACE; p.outAt = time; p.flash = 0.2; p.catchT = 0; p.dashT = 0;
  dropBall(p);
  shake = Math.max(shake, p.isHuman ? 14 : 7);
  burst(p.x, p.y, p.color, 22, 260);
  popup(p.x, p.y - 30, reason === 'caught' ? 'CAUGHT OUT!' : 'OUT!', '#ff5a3c', 24);
  sfx.hit(); sfx.out();
  // go sit on the nearest sideline
  const dl = p.x - A.x, dr = A.x + A.w - p.x, dt = p.y - A.y, db = A.y + A.h - p.y, m = Math.min(dl, dr, dt, db);
  p.sitX = m === dl ? A.x + p.r : m === dr ? A.x + A.w - p.r : p.x;
  p.sitY = m === dt ? A.y + p.r : m === db ? A.y + A.h - p.r : p.y;
  // don't stack on top of another sitter (and stay on your own half in teams)
  const [minX, maxX] = xRange(p);
  p.sitX = clamp(p.sitX, minX, maxX);
  for (let tries = 0; tries < 12; tries++) {
    const o = players.find(q => q !== p && !q.alive && Math.hypot(q.sitX - p.sitX, q.sitY - p.sitY) < p.r * 2.2);
    if (!o) break;
    if (m === dl || m === dr) p.sitY = clamp(p.sitY + (p.sitY < A.y + A.h / 2 ? 40 : -40), A.y + p.r, A.y + A.h - p.r);
    else p.sitX = clamp(p.sitX + (p.sitX < (minX + maxX) / 2 ? 40 : -40), minX, maxX);
  }
}
function revive(p, b) {
  p.alive = true; p.outT = 0; p.revives++;
  p.vx = 0; p.vy = 0; p.invuln = 0.6; p.pickCd = 0; p.catchCd = 0; p.dashCd = 0;
  if (b) { b.state = 'held'; b.holder = p; b.owner = null; p.ball = b; }
  p.aim = Math.atan2(A.y + A.h / 2 - p.y, A.x + A.w / 2 - p.x);
  if (p.ai) { p.ai.throwT = rand(0.4, 0.9); p.ai.target = null; }
  burst(p.x, p.y, '#80ed99', 18, 220);
  popup(p.x, p.y - 30, 'BACK IN!', '#80ed99', 22);
  sfx.catch();
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 5) });
  }
}
function popup(x, y, text, color, size) { popups.push({ x, y, text, color, size, life: 1.1 }); }

// ---------- update ----------
function update(dt) {
  time += dt;
  if (countdown > 0) {
    const before = Math.ceil(countdown);
    countdown -= dt;
    if (Math.ceil(countdown) !== before && countdown > 0) beep(440, 0.12, 'square', 0.06);
    if (countdown <= 0) beep(880, 0.25, 'square', 0.08);
    mouse.click = false; catchPressed = false; dashPressed = false;
    const me = players[0]; me.aim = Math.atan2(mouse.y - me.y, mouse.x - me.x);
    return;
  }

  for (const p of players) {
    if (!p.alive) {
      p.outT = Math.max(0, p.outT - dt); p.flash = Math.max(0, p.flash - dt);
      const k = 1 - Math.pow(0.002, dt);
      p.x += (p.sitX - p.x) * k; p.y += (p.sitY - p.y) * k;
      continue;
    }
    for (const k of ['catchT', 'catchCd', 'dashT', 'dashCd', 'invuln', 'pickCd', 'throwCd', 'flash']) p[k] = Math.max(0, p[k] - dt);
    if (p.isHuman) updateHuman(p, dt); else updateAI(p, dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    const [minX, maxX] = xRange(p);
    p.x = clamp(p.x, minX, maxX);
    p.y = clamp(p.y, A.y + p.r, A.y + A.h - p.r);
  }
  mouse.click = false; catchPressed = false; dashPressed = false;

  // player separation
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const a = players[i], b = players[j];
    if (!a.alive || !b.alive) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
    if (d < m && d > 0.01) {
      const push = (m - d) / 2, nx = dx / d, ny = dy / d;
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    }
  }

  updateBalls(dt);

  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const q of popups) { q.y -= 30 * dt; q.life -= dt; }
  popups = popups.filter(q => q.life > 0);
  shake *= Math.pow(0.02, dt);

  if (mode === 'teams') {
    // a team wins when everyone on the other team is sitting
    for (let t = 0; t < 2; t++) if (!players.some(p => p.team === t && p.alive)) { endGame(null, 1 - t); break; }
  } else {
    // last one standing wins (a sitter can still come back while 2+ are in)
    const alive = players.filter(p => p.alive);
    if (alive.length <= 1) endGame(alive[0]);
  }
}

function updateHuman(p, dt) {
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx--;
  if (keys['d'] || keys['arrowright']) mx++;
  if (keys['w'] || keys['arrowup']) my--;
  if (keys['s'] || keys['arrowdown']) my++;
  const l = Math.hypot(mx, my); if (l) { mx /= l; my /= l; }
  p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  if (dashPressed) startDash(p, mx || Math.cos(p.aim), my || Math.sin(p.aim));
  if (catchPressed) startCatch(p);
  if (mouse.click && p.ball && p.throwCd <= 0) throwBall(p, p.aim, PLAYER_THROW);
  steer(p, mx, my, PLAYER_SPEED, dt);
}

function steer(p, mx, my, speed, dt) {
  if (p.dashT > 0) return;
  const k = 1 - Math.pow(0.0001, dt); // snappy acceleration
  p.vx += (mx * speed - p.vx) * k;
  p.vy += (my * speed - p.vy) * k;
}

function updateAI(p, dt) {
  const D = DIFF[settings.diff], ai = p.ai;
  let mx = 0, my = 0;

  // --- detect incoming threats ---
  let threat = null;
  for (const b of balls) {
    if (b.state !== 'live' || !b.owner || !isEnemy(p, b.owner)) continue;
    const v2 = b.vx * b.vx + b.vy * b.vy; if (v2 < 1) continue;
    const rx = p.x - b.x, ry = p.y - b.y;
    const t = (rx * b.vx + ry * b.vy) / v2;
    if (t < 0 || t > 0.75) continue;
    const cx = b.x + b.vx * t - p.x, cy = b.y + b.vy * t - p.y;
    const d = Math.hypot(cx, cy);
    if (d < p.r + b.r + 16 && (!threat || t < threat.t)) threat = { b, t, cx, cy, d };
  }

  if (threat) {
    const b = threat.b;
    let re = ai.reacts.get(b.id);
    if (!re || re.throwTime !== b.throwStamp) {
      const r = Math.random();
      const action = (!p.ball && r < D.catch) ? 'catch' : (r < D.catch + D.dodge ? 'dodge' : 'none');
      re = { action, delay: rand(0, D.react), seen: 0, throwTime: b.throwStamp };
      ai.reacts.set(b.id, re);
    }
    re.seen += dt;
    if (re.seen >= re.delay) {
      if (re.action === 'catch' && threat.t < 0.16) startCatch(p);
      if (re.action === 'dodge' || (re.action === 'catch' && p.catchCd > 0 && p.catchT <= 0)) {
        const vl = Math.hypot(b.vx, b.vy);
        let px = -b.vy / vl, py = b.vx / vl;
        let side = -(px * threat.cx + py * threat.cy);
        if (Math.abs(side) < 2) side = ((A.x + A.w / 2 - p.x) * px + (A.y + A.h / 2 - p.y) * py);
        if (side < 0) { px = -px; py = -py; }
        // if dodging into a wall (or the center line), flip
        const [lo, hi] = xRange(p);
        if (p.x + px * 60 < lo || p.x + px * 60 > hi || p.y + py * 60 < A.y || p.y + py * 60 > A.y + A.h) { px = -px; py = -py; }
        mx = px; my = py;
        if (D.dash && threat.t < 0.3 && threat.d < p.r + b.r) startDash(p, px, py);
      }
    }
  }

  if (!mx && !my) {
    if (!p.ball) {
      // go for the nearest free ball (slightly prefer ones nobody else is closer to)
      let best = null, bd = 1e9;
      for (const b of balls) {
        if (b.state !== 'ground') continue;
        const [lo, hi] = xRange(p);
        if (b.x < lo - p.r - b.r || b.x > hi + p.r + b.r) continue; // can't reach it across the line
        let d = dist(p, b);
        for (const o of players) if (o !== p && o.alive && !o.ball && dist(o, b) < d * 0.7) d *= mode === 'teams' && !isEnemy(p, o) ? 3 : 1.6;
        if (d < bd) { bd = d; best = b; }
      }
      if (best) {
        mx = best.x - p.x; my = best.y - p.y;
      } else {
        // no balls available: keep distance from armed players
        for (const o of players) {
          if (!isEnemy(p, o) || !o.alive || !o.ball) continue;
          const dx = p.x - o.x, dy = p.y - o.y, d = Math.hypot(dx, dy) || 1;
          if (d < 400) { mx += dx / d * (400 - d) / 400; my += dy / d * (400 - d) / 400; }
        }
        ai.strafeT -= dt;
        if (ai.strafeT <= 0 || !ai.wander) { ai.strafeT = rand(1, 2.5); const [lo, hi] = xRange(p); ai.wander = { x: rand(lo + 40, hi - 40), y: rand(A.y + 60, A.y + A.h - 60) }; }
        const wx = ai.wander.x - p.x, wy = ai.wander.y - p.y, wl = Math.hypot(wx, wy) || 1;
        mx += wx / wl * 0.5; my += wy / wl * 0.5;
      }
    } else {
      // holding a ball: pick a target and harass it
      if (!ai.target || !ai.target.alive || Math.random() < dt * 0.15) {
        const others = players.filter(o => isEnemy(p, o) && o.alive);
        const human = others.find(o => o.isHuman);
        ai.target = (human && Math.random() < 0.45) ? human : others.sort((a, b) => dist(p, a) - dist(p, b))[Math.random() < 0.7 ? 0 : Math.floor(Math.random() * others.length)];
      }
      const t = ai.target;
      if (t) {
        const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy) || 1;
        const nx = dx / d, ny = dy / d;
        let fwd = d > 360 ? 1 : d < 220 ? -1 : 0;
        ai.strafeT -= dt;
        if (ai.strafeT <= 0) { ai.strafeT = rand(0.8, 2.2); ai.strafe *= -1; }
        mx = nx * fwd + -ny * ai.strafe * 0.7;
        my = ny * fwd + nx * ai.strafe * 0.7;
        p.aim = Math.atan2(dy, dx);
        ai.throwT -= dt;
        if (ai.throwT <= 0 && d < (mode === 'teams' ? 820 : 560) && p.throwCd <= 0) {
          // lead the target
          const spd = D.throwSpd, tt = d / spd;
          const lx = t.x + t.vx * tt * rand(0.5, 1) - p.x, ly = t.y + t.vy * tt * rand(0.5, 1) - p.y;
          const ang = Math.atan2(ly, lx) + rand(-D.err, D.err);
          p.aim = ang;
          throwBall(p, ang, spd * rand(0.92, 1.05));
          ai.throwT = rand(D.cool[0], D.cool[1]);
        }
      }
    }
  }

  // keep off the walls a bit
  const m = 50;
  const [lo, hi] = xRange(p);
  if (p.x < lo + m - p.r) mx += 0.6; if (p.x > hi - m + p.r) mx -= 0.6;
  if (p.y < A.y + m) my += 0.6; if (p.y > A.y + A.h - m) my -= 0.6;

  const l = Math.hypot(mx, my); if (l > 0.01) { mx /= l; my /= l; }
  if (!p.ball && (mx || my)) p.aim = Math.atan2(my, mx);
  steer(p, mx, my, D.speed, dt);
}

function updateBalls(dt) {
  for (const b of balls) {
    if (b.state === 'held') {
      const h = b.holder;
      b.x = h.x + Math.cos(h.aim) * (h.r + 4); b.y = h.y + Math.sin(h.aim) * (h.r + 4);
      continue;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.spin += Math.hypot(b.vx, b.vy) * dt * 0.05;
    // walls
    let bounced = false;
    if (b.x < A.x + b.r) { b.x = A.x + b.r; b.vx = Math.abs(b.vx) * 0.7; bounced = true; }
    if (b.x > A.x + A.w - b.r) { b.x = A.x + A.w - b.r; b.vx = -Math.abs(b.vx) * 0.7; bounced = true; }
    if (b.y < A.y + b.r) { b.y = A.y + b.r; b.vy = Math.abs(b.vy) * 0.7; bounced = true; }
    if (b.y > A.y + A.h - b.r) { b.y = A.y + A.h - b.r; b.vy = -Math.abs(b.vy) * 0.7; bounced = true; }
    if (bounced && b.state === 'live') { sfx.bounce(); b.state = 'ground'; b.owner = null; } // wall bounce = dead ball

    const spd = Math.hypot(b.vx, b.vy);
    if (b.state === 'live') {
      b.vx *= Math.pow(0.7, dt); b.vy *= Math.pow(0.7, dt);
      if (Math.random() < 0.6) particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.2, max: 0.2, color: b.owner ? b.owner.color : '#fff', r: 5 });
      if (spd < 240) { b.state = 'ground'; b.owner = null; }
      for (const p of players) {
        if (!p.alive || p === b.owner) continue;
        if (b.owner && !isEnemy(p, b.owner)) continue; // no friendly fire
        if (Math.hypot(p.x - b.x, p.y - b.y) > p.r + b.r) continue;
        if (p.catchT > 0 && !p.ball) {
          // caught it! thrower loses a life
          const thrower = b.owner;
          b.state = 'held'; b.holder = p; b.owner = null; p.ball = b;
          p.catchT = 0; p.catchCd = 0.3;
          sfx.catch(); burst(b.x, b.y, '#ffffff', 14, 200);
          popup(p.x, p.y - 34, 'NICE CATCH!', '#80ed99', 18);
          if (thrower && thrower.alive) knockOut(thrower, 'caught');
          if (mode === 'teams') {
            // a catch brings back the teammate who has been sitting longest
            const mate = players.filter(q => q.team === p.team && !q.alive).sort((a, c) => a.outAt - c.outAt)[0];
            if (mate) revive(mate, null);
          }
          break;
        }
        if (p.invuln > 0) continue;
        if (b.owner) b.owner.hits++;
        knockOut(p, 'hit');
        const nx = (b.x - p.x), ny = (b.y - p.y), nl = Math.hypot(nx, ny) || 1;
        b.vx = nx / nl * spd * 0.35 + rand(-40, 40); b.vy = ny / nl * spd * 0.35 + rand(-40, 40);
        b.state = 'ground'; b.owner = null;
        break;
      }
    } else if (b.state === 'ground') {
      const f = Math.pow(0.05, dt);
      b.vx *= f; b.vy *= f;
      for (const p of players) {
        if (!p.alive) {
          if (p.outT <= 0 && Math.hypot(p.x - b.x, p.y - b.y) < p.r + b.r + SIT_REACH) { revive(p, b); break; }
          continue;
        }
        if (p.ball || p.pickCd > 0) continue;
        if (Math.hypot(p.x - b.x, p.y - b.y) < p.r + b.r + 2) {
          b.state = 'held'; b.holder = p; p.ball = b;
          if (p.isHuman) sfx.pick();
          if (p.ai) p.ai.throwT = Math.max(p.ai.throwT, rand(0.3, 0.8));
          break;
        }
      }
    }
  }
}

function endGame(winner, winTeam) {
  if (state !== 'play') return;
  state = 'over';
  const t = document.getElementById('endTitle'), s = document.getElementById('endSub');
  const me = players[0];
  const stats = `You hit ${me.hits} player${me.hits === 1 ? '' : 's'} and came back ${me.revives} time${me.revives === 1 ? '' : 's'}.`;
  if (mode === 'teams') {
    const won = winTeam === me.team;
    t.textContent = won ? `🏆 ${TEAM_NAMES[winTeam]} TEAM WINS!` : `${TEAM_NAMES[winTeam]} TEAM WINS`;
    t.style.color = won ? '#80ed99' : '#ff5a3c';
    s.textContent = (won ? `Your team knocked out every ${TEAM_NAMES[1 - me.team].toLowerCase()} player (${settings.teamSize} v ${settings.teamSize}, ${settings.diff}). `
                         : `Your whole team ended up on the sideline. `) + stats;
  } else if (winner === me) {
    t.textContent = '🏆 YOU WIN!'; t.style.color = '#80ed99';
    s.textContent = `Last one standing against ${settings.cpus} CPU${settings.cpus > 1 ? 's' : ''} on ${settings.diff}. ${stats}`;
  } else {
    t.textContent = winner ? `${winner.name.toUpperCase()} WINS` : 'NOBODY WINS'; t.style.color = '#ff5a3c';
    s.textContent = `You were stuck on the sideline when the last player got knocked out. ${stats}`;
  }
  setTimeout(() => { if (state === 'over') endEl.classList.remove('hidden'); }, 900);
}

// ---------- render ----------
function drawCourt() {
  ctx.fillStyle = '#0e0f14'; ctx.fillRect(-50, -50, W + 100, H + 100);
  // floor
  const g = ctx.createLinearGradient(0, A.y, 0, A.y + A.h);
  g.addColorStop(0, '#c98b4f'); g.addColorStop(1, '#b57a42');
  ctx.fillStyle = g; ctx.fillRect(A.x, A.y, A.w, A.h);
  ctx.strokeStyle = '#0000001a'; ctx.lineWidth = 1;
  for (let y = A.y; y < A.y + A.h; y += 24) { ctx.beginPath(); ctx.moveTo(A.x, y); ctx.lineTo(A.x + A.w, y); ctx.stroke(); }
  // lines
  ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 3;
  ctx.strokeRect(A.x + 20, A.y + 20, A.w - 40, A.h - 40);
  ctx.beginPath(); ctx.arc(A.x + A.w / 2, A.y + A.h / 2, 90, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(A.x + A.w / 2, A.y + A.h / 2, 8, 0, Math.PI * 2); ctx.fillStyle = '#ffffffcc'; ctx.fill();
  if (state !== 'menu' && mode === 'teams') {
    ctx.fillStyle = TEAM_COLORS[0] + '1c'; ctx.fillRect(A.x, A.y, A.w / 2, A.h);
    ctx.fillStyle = TEAM_COLORS[1] + '1c'; ctx.fillRect(MID, A.y, A.w / 2, A.h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(MID, A.y); ctx.lineTo(MID, A.y + A.h); ctx.stroke();
  }
  // walls
  ctx.strokeStyle = '#3d4460'; ctx.lineWidth = 8;
  ctx.strokeRect(A.x - 4, A.y - 4, A.w + 8, A.h + 8);
}

function drawBall(b) {
  ctx.save();
  if (b.state !== 'held') {
    ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + 5, b.r, b.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  const live = b.state === 'live';
  ctx.translate(b.x, b.y); ctx.rotate(b.spin);
  ctx.fillStyle = live ? '#ff3b3b' : '#e63946';
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8d1b24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-b.r, 0); ctx.lineTo(b.r, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, b.r * 0.55, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.fillStyle = '#ffffff55'; ctx.beginPath(); ctx.arc(-3, -3, b.r * 0.35, 0, Math.PI * 2); ctx.fill();
  if (live) { ctx.strokeStyle = b.owner ? b.owner.color : '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, b.r + 3, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
}

function outline(p) {
  if (mode === 'teams') return TEAM_COLORS[p.team];
  return p.isHuman ? '#ff5a3c' : '#0006';
}
function drawPlayer(p) {
  if (!p.alive) {
    // sitting on the sideline, waiting for the ball
    const ready = p.outT <= 0;
    if (ready) {
      ctx.strokeStyle = p.color + '66'; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 10 + SIT_REACH, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = p.flash > 0 ? '#ff4444' : p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = outline(p); ctx.lineWidth = p.isHuman || mode === 'teams' ? 3 : 2; ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.fillRect(p.x - 7, p.y - 3, 5, 2); ctx.fillRect(p.x + 2, p.y - 3, 5, 2); // sleepy eyes
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000a'; ctx.fillText(p.name + ' (out)', p.x + 1, p.y - p.r - 7);
    ctx.fillStyle = p.color; ctx.fillText(p.name + ' (out)', p.x, p.y - p.r - 8);
    return;
  }
  if (p.invuln > 0 && Math.floor(time * 16) % 2) ctx.globalAlpha = 0.4;
  // shadow
  ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 8, p.r, p.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  // dash trail
  if (p.dashT > 0) { ctx.fillStyle = p.color + '55'; ctx.beginPath(); ctx.arc(p.x - p.vx * 0.04, p.y - p.vy * 0.04, p.r, 0, Math.PI * 2); ctx.fill(); }
  // body
  ctx.fillStyle = p.flash > 0 ? '#ff4444' : p.color;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = outline(p); ctx.lineWidth = p.isHuman ? 5 : mode === 'teams' ? 3.5 : 2; ctx.stroke();
  if (p.isHuman && mode === 'teams') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4, 0, Math.PI * 2); ctx.stroke(); }
  // eyes looking at aim
  const ex = Math.cos(p.aim), ey = Math.sin(p.aim), px = -ey, py = ex;
  for (const s of [-1, 1]) {
    const x = p.x + ex * 7 + px * 6 * s, y = p.y + ey * 7 + py * 6 * s;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + ex * 1.5, y + ey * 1.5, 2, 0, Math.PI * 2); ctx.fill();
  }
  // catch ring
  if (p.catchT > 0) {
    ctx.strokeStyle = '#80ed99'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8 + (0.28 - p.catchT) * 20, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // name + lives
  ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = '#000a'; ctx.fillText(p.name, p.x + 1, p.y - p.r - 11);
  ctx.fillStyle = p.color; ctx.fillText(p.name, p.x, p.y - p.r - 12);
}

function drawHUD() {
  // top bar
  ctx.fillStyle = '#1b1e29'; ctx.fillRect(0, 0, W, 56);
  ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui';
  const n = players.length, slot = Math.min(150, (W - 70) / n);
  players.forEach((p, i) => {
    const x = 10 + i * slot;
    ctx.globalAlpha = p.alive ? 1 : 0.45;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x + 10, 20, 8, 0, Math.PI * 2); ctx.fill();
    if (mode === 'teams') { ctx.strokeStyle = TEAM_COLORS[p.team]; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.fillText(p.name, x + 24, 24);
    ctx.font = '11px system-ui';
    ctx.fillStyle = p.alive ? (p.ball ? '#ffd166' : '#80ed99') : '#ff5a3c';
    ctx.fillText(p.alive ? (p.ball ? 'HAS BALL' : 'IN') : 'OUT', x + 24, 42);
    ctx.globalAlpha = 1;
  });
  // player cooldowns
  const me = players[0];
  if (me && !me.alive && state === 'play') {
    ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui'; ctx.fillStyle = '#ffd166';
    ctx.fillText(me.outT > 0 ? "You're out! Heading to the sideline…" : mode === 'teams' ? "You're out! Grab the ball when it rolls near you, or wait for a teammate's catch." : "You're out! Grab the ball when it rolls near you to get back in.", W / 2, A.y + A.h + 24);
  }
  if (me && me.alive) {
    ctx.textAlign = 'right'; ctx.font = '12px system-ui';
    ctx.fillStyle = me.catchCd > 0 ? '#667' : '#80ed99'; ctx.fillText('CATCH [Space]', W - 12, A.y + A.h + 22);
    ctx.fillStyle = me.dashCd > 0 ? '#667' : '#4cc9f0'; ctx.fillText('DASH [Shift]', W - 120, A.y + A.h + 22);
    ctx.fillStyle = me.ball ? '#ffd166' : '#667'; ctx.fillText(me.ball ? 'BALL READY [Click]' : 'NO BALL', W - 215, A.y + A.h + 22);
  }
  ctx.textAlign = 'left'; ctx.fillStyle = '#667'; ctx.font = '12px system-ui';
  if (mode === 'teams') {
    const cnt = t => players.filter(p => p.team === t && p.alive).length;
    ctx.fillText(`${settings.diff.toUpperCase()} · `, 12, A.y + A.h + 22);
    let x = 12 + ctx.measureText(`${settings.diff.toUpperCase()} · `).width;
    for (let t = 0; t < 2; t++) {
      const txt = `${TEAM_NAMES[t]} ${cnt(t)} in` + (t === 0 ? '  vs  ' : '');
      ctx.fillStyle = TEAM_COLORS[t]; ctx.font = 'bold 12px system-ui'; ctx.fillText(txt, x, A.y + A.h + 22);
      x += ctx.measureText(txt).width;
    }
  } else {
    ctx.fillText(`${settings.diff.toUpperCase()} · ${players.filter(p => p.alive).length} in`, 12, A.y + A.h + 22);
  }
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.8);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.4, x - s * 0.6, y - s * 1.4, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.4, x + s * 1.6, y - s * 0.4, x, y + s * 0.8);
  ctx.fill();
}

function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawCourt();
  if (state !== 'menu') {
    for (const b of balls) if (b.state !== 'held') drawBall(b);
    for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const p of players) if (!p.alive) drawPlayer(p);
    for (const p of players) if (p.alive) drawPlayer(p);
    for (const b of balls) if (b.state === 'held') drawBall(b);
    // aim line
    const me = players[0];
    if (me && me.alive && me.ball && countdown <= 0) {
      ctx.setLineDash([6, 8]); ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(me.x, me.y); ctx.lineTo(me.x + Math.cos(me.aim) * 140, me.y + Math.sin(me.aim) * 140); ctx.stroke();
      ctx.setLineDash([]);
    }
    for (const q of popups) {
      ctx.globalAlpha = Math.min(1, q.life * 2);
      ctx.font = `900 ${q.size}px system-ui`; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(q.text, q.x + 2, q.y + 2);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (state !== 'menu') drawHUD();

  ctx.textAlign = 'center';
  if (state === 'play' && countdown > 0) {
    const n = Math.ceil(countdown);
    ctx.font = '900 110px system-ui'; ctx.fillStyle = '#000a'; ctx.fillText(n, W / 2 + 4, H / 2 + 44);
    ctx.fillStyle = '#fff'; ctx.fillText(n, W / 2, H / 2 + 40);
  } else if (state === 'play' && countdown > -0.7) {
    ctx.font = '900 90px system-ui'; ctx.fillStyle = '#ff5a3c'; ctx.fillText('DODGE!', W / 2, H / 2 + 30);
  }
  if (state === 'play' || state === 'paused') drawPauseBtn();
}

function drawPauseBtn() {
  const b = PAUSE_BTN, hover = state === 'play' && overPauseBtn();
  ctx.fillStyle = hover ? '#3d4460' : '#2a2f42';
  ctx.strokeStyle = '#3d4460'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  if (state === 'paused') { // play triangle while paused
    ctx.beginPath(); ctx.moveTo(b.x + 13, b.y + 10); ctx.lineTo(b.x + 13, b.y + 26); ctx.lineTo(b.x + 27, b.y + 18); ctx.fill();
  } else {
    ctx.fillRect(b.x + 11, b.y + 10, 5, 16); ctx.fillRect(b.x + 20, b.y + 10, 5, 16);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'over') { // let particles finish
    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const q of popups) { q.y -= 30 * dt; q.life -= dt; }
    popups = popups.filter(q => q.life > 0);
    shake *= Math.pow(0.02, dt);
  }
  if (state === 'play' && countdown <= 0 && countdown > -1) countdown -= dt; // "DODGE!" banner timer
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
